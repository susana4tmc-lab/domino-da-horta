<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dominó da Horta — Plantas Companheiras</title>
<meta name="description" content="Dominó da Horta: um jogo de plantas companheiras do Mercado À Mão de Semear. Encosta peças com o mesmo símbolo.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<style>
:root{--bg:#f2f7f3;--card:#fff;--ink:#17352b;--mut:#5a6f66;--line:#c9dbd1;--acc:#1f6f5c;--acc2:#e8a23c;--bad:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10211b;--card:#183128;--ink:#e6f2ec;--mut:#9db5aa;--line:#2c4a3e;--acc:#4fb596;--acc2:#e8b050;--bad:#e57a66}}
:root[data-theme="dark"]{--bg:#10211b;--card:#183128;--ink:#e6f2ec;--mut:#9db5aa;--line:#2c4a3e;--acc:#4fb596;--acc2:#e8b050;--bad:#e57a66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}
h1{font:600 1.7rem/1.15 "Fredoka",system-ui,sans-serif;margin:4px 0 2px}
p.sub{margin:0 0 14px;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button{font:inherit;cursor:pointer;border:2px solid var(--acc);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;min-height:44px}
button.pri{background:var(--acc);color:#fff}
button:focus-visible,.pc:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.count{margin-left:auto;font-weight:600}
input{font:inherit;min-height:44px;width:7.5em;border:2px solid var(--line);border-radius:10px;padding:0 8px;background:var(--card);color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.chain{display:flex;flex-wrap:wrap;gap:6px;min-height:92px;align-items:center}
.empty{color:var(--mut)}
.ends{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:.9rem;flex-wrap:wrap}
.end{display:inline-flex;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:10px;padding:2px 8px;background:transparent;min-height:40px;color:var(--ink)}
.end.on{border-color:var(--acc2);border-style:solid;background:var(--card)}
.pc{display:inline-flex;border:2px solid var(--ink);border-radius:10px;background:var(--card);overflow:hidden;padding:0;min-height:0}
.pc .h{width:62px;padding:5px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.68rem;line-height:1.1}
.pc .h+.h{border-left:2px solid var(--ink)}
.pc .e{font-size:1.5rem;line-height:1}
.pc.hand{margin:0}
.pc.sel{outline:4px solid var(--acc2)}
.pc.hint{box-shadow:0 0 0 4px var(--acc2)}
.pc.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.pc.shake{animation:none;border-color:var(--bad)}}
.hand-wrap{display:flex;flex-wrap:wrap;gap:8px}
.msg{border-left:6px solid var(--acc);padding:8px 12px;margin:10px 0;background:var(--card);border-radius:0 10px 10px 0;min-height:56px}
.msg.bad{border-color:var(--bad)}
.msg.win{border-color:var(--acc2);font-weight:600}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.legend div{display:flex;gap:8px;align-items:flex-start;font-size:.85rem}
.legend b{display:block}
svg.s{width:22px;height:22px;flex:none}
.pc svg.s{width:18px;height:18px}
.top{display:flex;gap:14px;align-items:center;margin:2px 0 6px}
.logo{height:64px;width:auto;flex:none;background:#fff;border-radius:12px;padding:3px;display:block}
.top h1{margin:0}.top p.sub{margin:2px 0 0}
.foot{margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--mut);font-size:.85rem;text-align:center}
.icw{position:relative;display:block;width:46px;height:46px}
.em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
.ic{position:relative;width:46px;height:46px;border-radius:6px;background:#fff;object-fit:contain;display:block}
.msg .icw{display:inline-block;width:30px;height:30px;vertical-align:middle}
.msg .em{font-size:20px}
.msg .ic{display:block;width:30px;height:30px}
</style>
</head>

function pl(n){return {n:n,e:'<span class="icw"><span class="em" aria-hidden="true">'+P[n][0]+'</span><img class="ic" alt="" src="'+IMG[n]+'"></span>',g:P[n][1]}}
var pieces=T.map(function(p,i){return {id:i,a:pl(p[0]),b:pl(p[1])}});
var hand,chain,sel,hintOn,hist=[],hands=[[],[]],turn=0,mode=1,games=0,passes=0,names=["Aluno","Visitante"],$=function(i){return document.getElementById(i)};

function half(p){return '<span class="h"><span class="e">'+p.e+'</span><span>'+p.n+'</span>'+sym(p.g)+'</span>'}
function pcHtml(a,b){return half(a)+half(b)}
function ends(){return chain.length?[chain[0].l.g,chain[chain.length-1].r.g]:null}

// devolve orientação possível para a peça num lado, ou null
function fit(pc,side){
 var e=ends();if(!e)return [pc.a,pc.b];
 if(side==="R"){if(pc.a.g===e[1])return [pc.a,pc.b];if(pc.b.g===e[1])return [pc.b,pc.a]}
 else{if(pc.b.g===e[0])return [pc.a,pc.b];if(pc.a.g===e[0])return [pc.b,pc.a]}
 return null}

function render(){
 var e=ends();
 $("ends").innerHTML=e?('Ponta esquerda: <span class="end '+(sel!=null&&fit(byId(sel),"L")?'on':'')+'" id="eL">'+sym(e[0])+'</span> Ponta direita: <span class="end '+(sel!=null&&fit(byId(sel),"R")?'on':'')+'" id="eR">'+sym(e[1])+'</span>'):'';
 if(e){$("eL").onclick=function(){play("L")};$("eR").onclick=function(){play("R")};
  $("eL").setAttribute("role","button");$("eR").setAttribute("role","button");$("eL").tabIndex=0;$("eR").tabIndex=0;
  ["eL","eR"].forEach(function(i){$(i).onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();play(i==="eL"?"L":"R")}}})}
 $("chain").innerHTML=chain.length?chain.map(function(c){return '<span class="pc">'+pcHtml(c.l,c.r)+'</span>'}).join(""):'<span class="empty">A mesa está vazia. Joga a primeira peça.</span>';
 $("hand").innerHTML="";
 hand.forEach(function(id){
  var pc=byId(id),b=document.createElement("button");
  b.className="pc hand"+(sel===id?" sel":"")+(hintOn&&(!chain.length||fit(pc,"L")||fit(pc,"R"))?" hint":"");
  b.innerHTML=pcHtml(pc.a,pc.b);b.setAttribute("aria-label",pc.a.n+" e "+pc.b.n);
  b.onclick=function(){pick(id,b)};$("hand").appendChild(b)});
 $("count").textContent=(mode===2?"Vez de: "+names[turn]+" · ":"")+"Peças: "+(mode===2?names[0]+" "+hands[0].length+" / "+names[1]+" "+hands[1].length:hand.length)+" · Jogos: "+games;
 $("pass").hidden=mode!==2;$("nm").hidden=mode!==2;
 $("sub").textContent=mode===2?"Encosta peças com o mesmo símbolo. Cada jogador tem 10 peças: vence quem colocar primeiro todas as suas.":"Encosta peças com o mesmo símbolo. Vence quem colocar as 20 peças.";
 $("undo").disabled=!hist.length;
}
function byId(i){return pieces[i]}
function say(t,c){var m=$("msg");m.className="msg"+(c?" "+c:"");m.innerHTML=t}

function pick(id,btn){
 hintOn=false;var pc=byId(id);
 if(!chain.length){sel=id;play("R");return}
 var l=fit(pc,"L"),r=fit(pc,"R");
 if(!l&&!r){sel=null;render();var nb=[].slice.call($("hand").children).filter(function(x){return x.getAttribute("aria-label")===pc.a.n+" e "+pc.b.n})[0];if(nb)nb.classList.add("shake");say("Esta peça não encaixa em nenhuma ponta. Procura um símbolo igual ao de uma das pontas.","bad");return}
 sel=id;
 if(l&&r&&ends()[0]!==ends()[1]){render();say("Esta peça encaixa nos dois lados. Escolhe a ponta onde a queres pôr.");return}
 play(r?"R":"L");
}
function play(side){
 if(sel==null)return;var pc=byId(sel),o=fit(pc,side);
 if(!o){say("Essa ponta não combina com a peça.","bad");return}
 var touch,nw={id:pc.id,l:o[0],r:o[1],side:side};
 if(!chain.length){chain.push(nw);say("Primeira peça colocada. Agora procura um símbolo igual a uma das pontas.")}
 else{
  if(side==="R"){touch=[chain[chain.length-1].r,o[0]];chain.push(nw)}
  else{touch=[o[1],chain[0].l];chain.unshift(nw)}
  explain(touch)}
 var who=turn;hist.push({id:pc.id,side:side,turn:turn});hand=hand.filter(function(i){return i!==pc.id});hands[turn]=hand;sel=null;passes=0;if(mode===2&&hand.length){turn=1-turn;hand=hands[turn]}render();check(who);
}
function explain(t){
 var g=G[t[0].g],same=t[0].n===t[1].n;
 say('<b>'+(same?t[0].e+' '+t[0].n:t[0].e+' '+t[0].n+' e '+t[1].e+' '+t[1].n)+'</b> pertencem ao grupo <b>'+g.t+'</b> '+sym(t[0].g)+'<br>'+g.d);
}
function canPlay(){return !chain.length||hand.some(function(i){var p=byId(i);return fit(p,"L")||fit(p,"R")})}
function check(who){
 var e=ends();
 if(!hand.length){games++;render();if(mode===2){say(names[who]+" ganhou! Foi o primeiro a colocar todas as suas peças.","win");return}
  say('Parabéns! As 20 peças fecharam o círculo: as pontas têm o mesmo símbolo '+sym(e[0])+'. Consegues explicar a um adulto porque é que isto acontece?',"win");return}
 if(!canPlay())say(mode===2?names[turn]+' não tem peças que encaixem. Carrega em <b>Passar a vez</b>.':'Já não há peças que encaixem. Carrega em <b>Desfazer</b> e tenta outro caminho.',"bad");
 else if(mode===2)say(document.getElementById("msg").innerHTML+'<br><b>Agora joga: '+names[turn]+'</b>');
}
function newGame(){
 var ids=pieces.map(function(p){return p.id});
 for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=ids[i];ids[i]=ids[j];ids[j]=x}
 hands=mode===2?[ids.slice(0,10),ids.slice(10)]:[ids,[]];
 turn=0;hand=hands[0];chain=[];hist=[];passes=0;sel=null;hintOn=false;
 say(mode===2?"Joga primeiro: "+names[0]+". Escolhe uma peça.":"Escolhe uma peça para começar.");render();
}
$("new").onclick=newGame;
$("undo").onclick=function(){
 if(!hist.length)return;var m=hist.pop();
 if(m.side==="R")chain.pop();else chain.shift();
 turn=m.turn;hand=hands[turn];hand.push(m.id);passes=0;sel=null;hintOn=false;say("Jogada desfeita.");render();
};
$("pass").onclick=function(){
 if(mode!==2||!chain.length)return;
 if(canPlay()){say("Ainda tens peças que encaixam. Carrega em <b>Dica</b> para as ver.","bad");return}
 passes++;
 if(passes>=2){var a=hands[0].length,b=hands[1].length;games++;render();say(a===b?"Empate: ninguém pode jogar e ficaram com o mesmo número de peças.":"Ninguém pode jogar. Ganhou "+names[a<b?0:1]+", que ficou com menos peças.","win");return}
 turn=1-turn;hand=hands[turn];sel=null;render();say(names[1-turn]+" passou. Agora joga: <b>"+names[turn]+"</b>");
};
$("mode").onchange=function(){mode=+this.value;newGame()};
["n0","n1"].forEach(function(id,k){$(id).oninput=function(){names[k]=this.value.replace(/[<>&"]/g,"").trim()||(k?"Visitante":"Aluno");render()}});
$("hint").onclick=function(){hintOn=true;sel=null;render();say("As peças com brilho dourado encaixam numa das pontas.")};
$("legend").innerHTML=Object.keys(G).map(function(k){return '<div>'+sym(k)+'<span><b>'+G[k].t+'</b>'+G[k].n+'</span></div>'}).join("");
newGame();
